    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
        }
        
        .summary-card .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .summary-card h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .summary-card p {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .test-sections {
            display: grid;
            gap: 20px;
        }
        
        .test-section {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 400;
        }
        
        .section-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-success {
            background: #2ecc71;
        }
        
        .status-warning {
            background: #f39c12;
        }
        
        .status-danger {
            background: #e74c3c;
        }
        
        .section-content {
            padding: 25px;
        }
        
        .test-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #ddd;
        }
        
        .test-item.success {
            border-left-color: #2ecc71;
            background: #d4edda;
        }
        
        .test-item.warning {
            border-left-color: #f39c12;
            background: #fff3cd;
        }
        
        .test-item.danger {

            background: #f8d7da;

            width: 30px;
            text-align: center;
        }
        
        .test-item .content {

        }
        
        .test-item .title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .test-item .details {
            font-size: 0.9rem;
            color: #666;
        }
        
        .test-item .duration {
            font-size: 0.8rem;
            color: #999;
            margin-left: auto;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-item .value {
            font-size: 2rem;

            color: #2c3e50;
        }
        
        .stat-item .label {

            margin-top: 5px;

            right: 20px;

            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            gap: 10px;
            align-items: center;

        .btn {

            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: #666;
        }
        
        .auto-refresh input[type="checkbox"] {
            margin: 0;
        }

            color: #2c3e50;
            padding: 10px 20px;
            border-radius: 0 0 15px 15px;
            text-align: center;
            font-size: 0.9rem;

            cursor: pointer;
            user-select: none;
        }
        
        .collapsible-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .collapsible-content.collapsed {
            max-height: 0;
        }

            padding: 15px;

        // 요약 카드 렌더링
        function renderSummaryCards(data) {
            document.getElementById('total-tests').textContent = data.metadata.total_tests;
            document.getElementById('passed-tests').textContent = data.metadata.passed_tests;
            document.getElementById('failed-tests').textContent = data.metadata.failed_tests;
            document.getElementById('test-duration').textContent = data.metadata.duration;
        }

        // 테스트 섹션 렌더링
        function renderTestSections(data) {
            const container = document.getElementById('test-sections');
            container.innerHTML = '';

            data.sections.forEach((section, index) => {
                const sectionElement = createTestSection(section, index);
                container.appendChild(sectionElement);
            });
        }

        // 테스트 섹션 생성
        function createTestSection(section, index) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'test-section';

            const statusClass = `status-${section.status}`;
            const statusText = {
                'success': '성공',
                'warning': '경고', 
                'danger': '실패'
            }[section.status];

            sectionDiv.innerHTML = `
                <div class="section-header collapsible-header" onclick="toggleSection(${index})">
                    <h2>${section.name}</h2>
                    <span class="section-status ${statusClass}">${statusText}</span>
                </div>
                <div class="section-content collapsible-content" id="section-${index}">
                    ${section.tests.map(test => createTestItem(test)).join('')}
                </div>
            `;

            return sectionDiv;
        }

                <div class="test-item ${test.status}">
                    <div class="icon">${iconMap[test.status]}</div>
                    <div class="content">
                        <div class="title">${test.name}</div>
                        <div class="details">${test.details}</div>
                        ${errorDetails}
                    </div>
                    <div class="duration">${test.duration}</div>
                </div>
            `;
        }

        // 테스트 데이터 요약 렌더링
        function renderTestDataSummary(data) {
            const container = document.getElementById('test-data-list');
            container.innerHTML = '';

            data.testData.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'test-data-item';
                itemDiv.innerHTML = `
                    <span><strong>${item.type}</strong>: ${item.count}개</span>
                    <span style="font-size: 0.8rem; color: #666;">${item.pattern}</span>
                `;
                container.appendChild(itemDiv);
            });
        }

        // 섹션 토글
        function toggleSection(index) {
            const content = document.getElementById(`section-${index}`);
            content.classList.toggle('collapsed');
        }

        // 데이터 새로고침
        async function refreshData() {
            const refreshIcon = document.getElementById('refresh-icon');
            refreshIcon.innerHTML = '<div class="loading-spinner"></div>';
            
            try {
                await loadTestResults();
            } finally {
                refreshIcon.textContent = '🔄';
            }
        }

        // 자동 새로고침 토글
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('auto-refresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshData, 30000);
                console.log('🔄 자동 새로고침 활성화 (30초)');
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                console.log('⏹️ 자동 새로고침 비활성화');
            }
        }

        // 타임스탬프 업데이트
        function updateTimestamp() {
            const now = new Date();
            const timestamp = now.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('timestamp').textContent = timestamp;
        }

        // 로딩 상태 표시
        function showLoadingState() {
            const summaryCards = document.querySelectorAll('.summary-card h3');
            summaryCards.forEach(card => {
                card.innerHTML = '<div class="loading-spinner"></div>';
            });
        }

        // 로딩 상태 숨김
        function hideLoadingState() {
            // 로딩 스피너가 제거되고 실제 데이터가 표시됨
        }

        // 오류 상태 표시
        function showErrorState(message) {
            const container = document.getElementById('test-sections');
            container.innerHTML = `
                <div class="test-section">
                    <div class="section-header" style="background: #e74c3c;">
                        <h2>오류 발생</h2>
                        <span class="section-status status-danger">실패</span>
                    </div>
                    <div class="section-content">
                        <div class="test-item danger">
                            <div class="icon">❌</div>
                            <div class="content">
                                <div class="title">데이터 로드 실패</div>
                                <div class="details">${message}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
